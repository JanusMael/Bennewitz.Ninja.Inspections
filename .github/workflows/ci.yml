name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  # The solution builds tests/XamlQuality.ThemeRuntime.Tests, which takes Avalonia, and Avalonia's
  # build telemetry otherwise starts a process that outlives the build.
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build XamlQuality.slnx -c Release --nologo -warnaserror

      # ⚠ Three operating systems, and that is not ceremony for a library with no platform
      # code. These rules compare and normalise PATHS, and path separators and case sensitivity
      # differ per OS — a rule that scans "src/Views" resolves on Linux and silently matches
      # nothing on a case-sensitive filesystem if it was written against Windows. That class of
      # bug only ever appears in a consumer's CI.
      - name: Test
        run: dotnet test --solution XamlQuality.slnx --no-build -c Release

  pack:
    name: Pack (verify the packages build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # ⛔ Packing on every push, not only on a release. A packaging error — a missing README,
      # an unset licence, a tool that does not pack as a tool — is invisible to build and test,
      # and finding it during a release means finding it at the one moment the version is
      # already immutable.
      - name: Pack
        run: dotnet pack XamlQuality.slnx -c Release --nologo /p:Version=0.0.0-ci --output ./packages/ci

      - name: List packages
        run: ls -l ./packages/ci

  # The family conventions: documentation at the root and in every top-level directory, the
  # description, topics, feature toggles and rulesets. See docs/repository-conventions.md in
  # Bennewitz.Ninja.Templates.
  #
  # ⚠ The job name is a required check in .github/repository.json. Renaming it means changing that
  # list and running `repo-conventions apply` in the same change, or every pull request blocks.
  conventions:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check the repository conventions
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run --file scripts/repo-conventions.cs -- check

  # The verification tooling of plans/00001. The real-code comparison runs every rule over the
  # consumers' markup and build output that tools/real-code/inputs.json pins, and fails when what
  # they print differs from the record of what main printed, tools/real-code/expected/. One
  # platform is enough: the records are text, and the library writes their paths with '/'. The
  # mutation runner's smoke catalog then shows tools/mutate.cs still works, and the headless probe
  # and tools/probe.cs, which runs it, still build.
  #
  # ⚠ The job name is a required check in .github/repository.json, as the others are.
  verification:
    name: Verification tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Each input is fetched and built once; the key changes with the inputs, the SDK and the way
      # real-code.cs builds them, any of which makes a cached build stale.
      - name: Restore the real-code inputs
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/real-code
          key: real-code-${{ runner.os }}-${{ hashFiles('tools/real-code/inputs.json', 'tools/real-code.cs', 'global.json') }}

      - name: Real-code comparison
        env:
          XQ_REAL_CODE_CACHE: ${{ runner.temp }}/real-code
        run: dotnet run --file tools/real-code.cs

      # Two defects in code that rarely changes, each failing one known test: the mutation runner
      # still plants, rebuilds, runs and puts back, on a platform other than the one it was written on.
      - name: Mutation runner smoke
        run: dotnet run --file tools/mutate.cs -- ExpanderAutomationNameRuleTests tools/mutate/smoke.json --workers 2

      # Built, not run: measuring the probe's cases here would gate every rule change on them, which
      # plans/00001 leaves to a decision of its own. AVALONIA_TELEMETRY_OPTOUT keeps Avalonia's build
      # telemetry, a process that outlives the build, from starting.
      - name: Headless probe builds
        env:
          AVALONIA_TELEMETRY_OPTOUT: 1
        run: |
          dotnet build tools/probe/Probe/Probe.csproj -c Release
          dotnet build tools/probe.cs
